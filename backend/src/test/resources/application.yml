spring:
  application:
    name: IntelliDoc AI Backend Test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: false

jwt:
  secret: test-secret-key-for-intellidoc-ai-testing-purposes-only-32-chars
  expiration: 86400000

ai:
  service:
    url: http://localhost:8000
