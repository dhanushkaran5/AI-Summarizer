spring:
  application:
    name: IntelliDoc AI Backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # H2 Database (Development Default)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/intellidoc;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # File upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Server
server:
  port: ${PORT:8080}

# JWT
jwt:
  secret: ${JWT_SECRET:intellidoc-ai-secret-key-change-this-in-production-minimum-256-bits-for-security}
  expiration: ${JWT_EXPIRATION_MS:86400000}

# AI Service
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

# File storage
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
